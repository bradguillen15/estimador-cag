name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is already in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # Job names are the status checks required by the `main` branch protection. Keep them stable.
    name: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Python version comes from .python-version; --locked fails if uv.lock is out of date.
      - run: uv sync --locked

      # tests/conftest.py pins fake settings and blocks real LLM calls: no secrets needed.
      - run: uv run pytest

  web:
    name: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:web
      # tsc -b type-checks the app and the tests before bundling.
      - run: pnpm build
