# Local development only: Redis Stack (RediSearch is needed by the semantic cache; the exact
# cache works with it too). `pnpm dev` starts it when a cache flag is enabled.
services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
